<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}LearnSpace{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f5f7fb;color:#1e293b;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.navbar{background:#12223c!important}.brand-bubble{background:#5579f5;color:white;border-radius:12px;padding:6px 11px;margin-right:8px}
.hero{background:linear-gradient(125deg,#1b3258,#375ac7);color:white;border-radius:24px;padding:45px}
.card{border:1px solid #e5eaf2;border-radius:18px;box-shadow:0 6px 20px rgba(16,37,72,.035)}
.btn-primary{background:#4267e8;border-color:#4267e8}.pill{background:#eaf0ff;border-radius:99px;color:#3756b5;padding:5px 12px;font-size:.85rem;font-weight:600}
</style></head><body>
<nav class="navbar navbar-dark py-3"><div class="container d-flex align-items-center">
<a class="navbar-brand fw-bold" href="{% url 'onlinecourse:index' %}"><span class="brand-bubble">L</span>LearnSpace</a>
<div class="d-flex gap-2 align-items-center">
{% if user.is_authenticated %}<span class="text-white-50 me-2">{{ user.username }}</span>
<form method="post" action="{% url 'onlinecourse:logout' %}">{% csrf_token %}<button class="btn btn-outline-light btn-sm">Log out</button></form>
{% else %}<a class="btn btn-outline-light btn-sm" href="{% url 'onlinecourse:login' %}">Log in</a>
<a class="btn btn-light btn-sm" href="{% url 'onlinecourse:signup' %}">Sign up</a>{% endif %}</div></div></nav>
<main class="container py-5">{% block content %}{% endblock %}</main>
<footer class="container py-4 text-center text-secondary small">Online Course Application · Django Final Project</footer>
</body></html>
