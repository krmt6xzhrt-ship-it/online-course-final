{% extends 'onlinecourse/base.html' %}
{% block title %}Log in · LearnSpace{% endblock %}
{% block content %}<div class="card p-4 mx-auto" style="max-width:440px"><h1 class="h3 mb-3">Log in</h1>
{% if form.errors %}<div class="alert alert-danger">Invalid username or password.</div>{% endif %}
<form method="post">{% csrf_token %}<div class="mb-3"><label class="form-label">Username</label><input class="form-control" name="username" required></div>
<div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required></div>
<input type="hidden" name="next" value="{{ next }}"><button class="btn btn-primary w-100">Log in</button></form>
<p class="mt-3 mb-0">No account? <a href="{% url 'onlinecourse:signup' %}">Create one</a></p></div>{% endblock %}
